spec:
  name: rawrz-security-platform
  region: nyc
  services:
    - name: api
      http_port: 8080
      instance_count: 1
      instance_size_slug: basic-xxs
      routes:
        - path: /
      envs:
        - key: NODE_ENV
          value: production
          scope: RUN_AND_BUILD_TIME
        - key: AUTH_TOKEN
          scope: RUN_TIME
          type: SECRET
      dockerfile_path: Dockerfile
      run_command: node server.js

