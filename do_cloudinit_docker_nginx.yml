#cloud-config
timezone: America/New_York
package_update: true
package_upgrade: true

packages:
  - ufw
  - fail2ban
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

write_files:
  - path: /var/www/index.html
    permissions: '0644'
    content: |
      <!doctype html>
      <html><head><meta charset="utf-8"/><title>ScreenPilot</title></head>
      <body><h1>ScreenPilot</h1><p>Landing page is live (Docker nginx).</p></body></html>

runcmd:
  - ufw allow OpenSSH
  - ufw allow 80
  - ufw --force enable
  - |
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
      apt-get update -y
      apt-get install -y docker-ce docker-ce-cli containerd.io
  - mkdir -p /var/www
  - docker run -d --restart unless-stopped -p 80:80 -v /var/www:/usr/share/nginx/html:ro nginx:alpine
  - echo "✅ docker nginx online" | systemd-cat -t cloud-init

