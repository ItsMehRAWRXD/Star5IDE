spec:
  name: rawrz-security-platform
  services:
    - name: api
      http_port: 8080
      instance_count: 1
      instance_size_slug: basic-xxs
      routes:
        - path: /
      envs:
        - key: NODE_ENV
          value: production
          scope: RUN_AND_BUILD_TIME
        - key: AUTH_TOKEN
          scope: RUN_TIME
          type: SECRET
      dockerfile_path: Dockerfile
      health_check:
        http_path: /healthz
        initial_delay_seconds: 5
        period_seconds: 10
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 3
