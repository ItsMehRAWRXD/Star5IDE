<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Camellia Encrypt Server</title></head>
  <body>
    <h1>Camellia Encrypt Server</h1>
    <ul>
      <li><a href="/health" target="_blank">/health</a></li>
      <li><a href="/capabilities" target="_blank">/capabilities</a></li>
      <li><a href="/capabilities/dynamic" target="_blank">/capabilities/dynamic</a></li>
    </ul>
    <pre id="out"></pre>
    <script>
      const out = document.getElementById('out');
      Promise.all([fetch('/health'), fetch('/capabilities')])
        .then(rs => Promise.all(rs.map(r=>r.json()))).then(x => out.textContent = JSON.stringify(x,null,2))
        .catch(e => out.textContent = String(e));
    </script>
  </body>
</html>
