<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File Encryption and Decryption Tool</title>
  <style>
    body { font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial; margin: 0; padding: 24px; background: #fafafa; }
    .card { max-width: 640px; margin: 0 auto; border: 1px solid #ddd; border-radius: 12px; padding: 16px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; color: #333; }
    h2, h3 { color: #555; }
    label { display: block; margin: 8px 0 4px; font-weight: 500; }
    input[type=file], select, button, input[type=text], input[type=password] { 
      width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; 
      font-size: 14px; transition: border-color 0.2s;
    }
    input:focus, select:focus, button:focus { outline: 2px solid #007acc; outline-offset: 2px; border-color: #007acc; }
    button { background: #007acc; color: white; border: none; cursor: pointer; font-weight: 500; }
    button:hover { background: #005a9e; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f7f7f7; padding: 10px; border-radius: 8px; font-family: monospace; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .error { color: #d32f2f; background: #ffebee; padding: 8px; border-radius: 4px; margin: 8px 0; }
    .success { color: #2e7d32; background: #e8f5e8; padding: 8px; border-radius: 4px; margin: 8px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Encrypt / Decrypt</h1>

    <div id="menu" style="margin:8px 0 16px; display:flex; gap:8px; flex-wrap:wrap;"></div>
    <label for="cipher">Cipher</label>
    <select id="cipher">
      <option value="camellia-256-cbc" selected>Camellia-256-CBC (default)</option>
      <option value="aes-256-cbc">AES-256-CBC</option>
    </select>

    <label for="mode">Mode</label>
    <select id="mode">
      <option value="password" selected>Password required</option>
      <option value="autokey">No password (embed random key)</option>
    </select>

    <label for="pass">Passphrase (ignored in autokey)</label>
    <input id="pass" type="password" placeholder="Enter passphrase" />

    <label for="encExt">Encrypted extension (blank = keep original)</label>
    <input id="encExt" type="text" placeholder="(blank = keep original)" value="" />

    <label for="decExt">Decrypted extension (include dot or leave empty)</label>
    <input id="decExt" type="text" placeholder=".bin" value=".bin" />

    <div class="row">
      <div>
        <h3>Encrypt</h3>
        <input id="encfile" type="file" />
        <button id="pickbtn" type="button">Pick source (overwrite-capable)</button>
        <label><input id="overwrite" type="checkbox" /> Overwrite original when supported</label>
        <button id="encbtn">Encrypt</button>
      </div>
      <div>
        <h3>Decrypt</h3>
        <input id="decfile" type="file" />
        <button id="decbtn">Decrypt & Download</button>
      </div>
    </div>

    

    <h3>Log</h3>
    <pre id="log"></pre>

    
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let srcHandle = null; // File System Access API handle (if user picked)
    function log(msg) { const el = $("log"); el.textContent += msg + "\n"; }

    async function go(path, file) {
      const pass = $("pass").value.trim();
      const mode = $("mode").value;
      const cipher = $("cipher").value;
      if (mode === 'password' && !pass) { alert("Enter passphrase"); return; }
      if (!file) { alert("Choose a file"); return; }
      const apiBase = new URLSearchParams(location.search).get('api') || `${location.protocol}//${location.host}`;
      const match = (file.name || 'file').match(/^(.*?)(\.[^.]+)?$/);
      const base = (match && match[1]) ? match[1] : (file.name || 'file');
      const origExt = (match && match[2]) ? match[2] : '';
      let ext = path.includes('encrypt') ? ($("encExt").value || '') : ($("decExt").value || '');
      if (path.includes('encrypt') && !ext) ext = origExt; // default: keep original on encrypt
      const url = `${apiBase}${path}?${new URLSearchParams({ pass, cipher, download: '1', mode, name: base, ext }).toString()}`;
      const res = await fetch(url, { method: 'POST', body: file });
      if (!res.ok) {
        const t = await res.text();
        log(`Error ${res.status}: ${t}`);
        return;
      }
      const blob = await res.blob();
      // If encrypting and user opted to overwrite and we have a handle, try writing back
      if (path.includes('encrypt') && $("overwrite").checked && srcHandle && 'createWritable' in srcHandle) {
        try {
          // Request write permission if needed
          if (await srcHandle.queryPermission({ mode: 'readwrite' }) !== 'granted') {
            await srcHandle.requestPermission({ mode: 'readwrite' });
          }
          const writable = await srcHandle.createWritable();
          await writable.write(blob);
          await writable.close();
          log('Saved back to original file.');
          return;
        } catch (e) {
          log('Overwrite failed, falling back to download: ' + e.message);
        }
      }
      // Fallback: normal download
      const a = document.createElement('a');
      let dlExt = path.includes('encrypt') ? ($("encExt").value || '') : ($("decExt").value || '');
      if (path.includes('encrypt') && !dlExt) dlExt = origExt; // mirror server choice
      a.href = URL.createObjectURL(blob);
      a.download = base + dlExt;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    $("encbtn").onclick = () => go('/encrypt', (window.__srcFile || $("encfile").files[0]));
    $("decbtn").onclick = () => go('/decrypt', $("decfile").files[0]);

    // Menu actions
    

    // Pick source using the File System Access API (Chrome/Edge desktop)
    $("pickbtn").onclick = async () => {
      if (!('showOpenFilePicker' in window)) {
        alert('Your browser does not support file handles. Use the file picker above.');
        return;
      }
      try {
        const [handle] = await window.showOpenFilePicker({ multiple: false });
        srcHandle = handle;
        const file = await handle.getFile();
        window.__srcFile = file;
        log('Picked source: ' + file.name);
      } catch (e) {
        if (e && e.name !== 'AbortError') log('Pick cancelled or failed: ' + e.message);
      }
    };
  </script>
</body>
</html>
