<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Encrypt/Decrypt</title>
  <style>
    body { font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial; margin: 0; padding: 24px; }
    .card { max-width: 640px; margin: 0 auto; border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    h1 { margin-top: 0; }
    label { display: block; margin: 8px 0 4px; }
    input[type=file], select, button { width: 100%; padding: 10px; margin-bottom: 10px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f7f7f7; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Encrypt / Decrypt</h1>
    <label for="cipher">Cipher</label>
    <select id="cipher">
      <option value="camellia-256-cbc" selected>Camellia-256-CBC (default)</option>
      <option value="carmilla-256-cbc">Carmilla-256-CBC (AES-256-CBC)</option>
    </select>

    <label for="mode">Mode</label>
    <select id="mode">
      <option value="password" selected>Password required</option>
      <option value="autokey">No password (embed random key)</option>
    </select>

    <label for="pass">Passphrase (ignored in autokey)</label>
    <input id="pass" type="password" placeholder="Enter passphrase" />

    <label for="encExt">Encrypted extension (blank = keep original)</label>
    <input id="encExt" type="text" placeholder="(blank = keep original)" value="" />

    <label for="decExt">Decrypted extension (include dot or leave empty)</label>
    <input id="decExt" type="text" placeholder=".bin" value=".bin" />

    <div class="row">
      <div>
        <h3>Encrypt</h3>
        <input id="encfile" type="file" />
        <button id="encbtn">Encrypt & Download</button>
      </div>
      <div>
        <h3>Decrypt</h3>
        <input id="decfile" type="file" />
        <button id="decbtn">Decrypt & Download</button>
      </div>
    </div>

    <h3>Log</h3>
    <pre id="log"></pre>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    function log(msg) { const el = $("log"); el.textContent += msg + "\n"; }

    async function go(path, file) {
      const pass = $("pass").value.trim();
      const mode = $("mode").value;
      const cipher = $("cipher").value;
      if (mode === 'password' && !pass) { alert("Enter passphrase"); return; }
      if (!file) { alert("Choose a file"); return; }
      const apiBase = new URLSearchParams(location.search).get('api') || '';
      const match = (file.name || 'file').match(/^(.*?)(\.[^.]+)?$/);
      const base = (match && match[1]) ? match[1] : (file.name || 'file');
      const origExt = (match && match[2]) ? match[2] : '';
      let ext = path.includes('encrypt') ? ($("encExt").value || '') : ($("decExt").value || '');
      if (path.includes('encrypt') && !ext) ext = origExt; // default: keep original on encrypt
      const url = `${apiBase}${path}?${new URLSearchParams({ pass, cipher, download: '1', mode, name: base, ext }).toString()}`;
      const res = await fetch(url, { method: 'POST', body: file });
      if (!res.ok) {
        const t = await res.text();
        log(`Error ${res.status}: ${t}`);
        return;
      }
      const blob = await res.blob();
      const a = document.createElement('a');
      let dlExt = path.includes('encrypt') ? ($("encExt").value || '') : ($("decExt").value || '');
      if (path.includes('encrypt') && !dlExt) dlExt = origExt; // mirror server choice
      a.href = URL.createObjectURL(blob);
      a.download = base + dlExt;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    $("encbtn").onclick = () => go('/encrypt', $("encfile").files[0]);
    $("decbtn").onclick = () => go('/decrypt', $("decfile").files[0]);
  </script>
</body>
</html>
