#cloud-config
timezone: America/New_York
package_update: true
package_upgrade: true

packages:
  - ufw
  - fail2ban
  - nginx

write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    content: |
      <!doctype html>
      <html><head><meta charset="utf-8"/><title>ScreenPilot</title></head>
      <body><h1>ScreenPilot</h1><p>Landing page is live (nginx).</p></body></html>

runcmd:
  - ufw allow OpenSSH
  - ufw allow 80
  - ufw allow 443
  - ufw --force enable
  - systemctl enable --now nginx
  - echo "✅ nginx static online" | systemd-cat -t cloud-init

