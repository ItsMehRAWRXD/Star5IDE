name: rawrz-security-platform-direct
services:
- name: rawrz-web
  source_dir: .
  run_command: node src/app.js
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 3000
  routes:
  - path: /
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3000"
  - key: JWT_SECRET
    value: rawrz-security-platform-jwt-secret-2024-production
  - key: FRONTEND_URL
    value: https://creenpilot.dev
  - key: ALLOWED_ORIGINS
    value: https://creenpilot.dev
  build_command: npm install
