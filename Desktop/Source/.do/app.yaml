name: star5ide-platform
services:
- name: star5ide-backend
  source_dir: /
  github:
    repo: ItsMehRAWRXD/Star5IDE
    branch: security/cleanup
  run_command: npm start
  dockerfile_path: Dockerfile
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 3001
  routes:
  - path: /
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3001"
  - key: MONGODB_URI
    value: mongodb+srv://garrettaosborne_db_user:bibbles11@cluster0.sjccoyd.mongodb.net/
  - key: JWT_SECRET
    value: your-super-secret-jwt-key-change-in-production
  - key: FRONTEND_URL
    value: https://screenpilot.dev
domains:
- domain: screenpilot.dev
  type: PRIMARY
- domain: www.screenpilot.dev
  type: ALIAS
