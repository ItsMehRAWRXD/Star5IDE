services:
  saascryptingplatform:
    image: saascryptingplatform
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///crypting_saas.db
      - SECRET_KEY=your-secret-key-here
      - JWT_SECRET=your-jwt-secret-here
      - CORS_ORIGINS=http://localhost:3000,https://precious-cat-89543d.netlify.app
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./instance:/app/instance
    restart: unless-stopped
