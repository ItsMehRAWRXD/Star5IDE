<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RawrZ Custom IDE - Professional Development Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/material.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            overflow: hidden;
        }

        .ide-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
        }

        .sidebar-header h3 {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }

        .file-explorer {
            flex: 1;
            padding: 10px;
        }

        .file-tree {
            list-style: none;
        }

        .file-item {
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            display: flex;
            align-items: center;
            font-size: 13px;
        }

        .file-item:hover {
            background: #2a2d2e;
        }

        .file-item.active {
            background: #094771;
        }

        .file-icon {
            margin-right: 8px;
            width: 16px;
            text-align: center;
        }

        /* Main Editor Area */
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .tab-bar {
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            overflow-x: auto;
        }

        .tab {
            padding: 10px 15px;
            background: #2d2d30;
            border-right: 1px solid #3e3e42;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        .tab.active {
            background: #1e1e1e;
            color: #ffffff;
        }

        .tab-close {
            margin-left: 8px;
            cursor: pointer;
            opacity: 0.7;
        }

        .tab-close:hover {
            opacity: 1;
        }

        /* Code Editor */
        .code-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .editor-container {
            flex: 1;
            position: relative;
        }

        .editor-textarea {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            outline: none;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            padding: 20px;
            resize: none;
            tab-size: 4;
        }

        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            width: 50px;
            height: 100%;
            background: #1e1e1e;
            border-right: 1px solid #3e3e42;
            padding: 20px 10px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #858585;
            text-align: right;
            user-select: none;
        }

        /* Status Bar */
        .status-bar {
            background: #007acc;
            color: white;
            padding: 5px 15px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-left {
            display: flex;
            gap: 20px;
        }

        .status-right {
            display: flex;
            gap: 20px;
        }

        /* Terminal */
        .terminal {
            height: 200px;
            background: #0c0c0c;
            border-top: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            background: #2d2d30;
            padding: 5px 15px;
            font-size: 12px;
            color: #cccccc;
            border-bottom: 1px solid #3e3e42;
        }

        .terminal-content {
            flex: 1;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            overflow-y: auto;
            color: #00ff00;
        }

        .terminal-input {
            background: transparent;
            border: none;
            outline: none;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            width: 100%;
        }

        /* Toolbar */
        .toolbar {
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            padding: 8px 15px;
            display: flex;
            gap: 10px;
        }

        .toolbar-btn {
            background: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .toolbar-btn:hover {
            background: #1177bb;
        }

        .toolbar-btn:disabled {
            background: #3e3e42;
            color: #858585;
            cursor: not-allowed;
        }

        /* Context Menu */
        .context-menu {
            position: absolute;
            background: #2d2d30;
            border: 1px solid #3e3e42;
            border-radius: 3px;
            padding: 5px 0;
            z-index: 1000;
            min-width: 150px;
            display: none;
        }

        .context-menu-item {
            padding: 8px 15px;
            cursor: pointer;
            font-size: 13px;
        }

        .context-menu-item:hover {
            background: #094771;
        }

        /* Syntax Highlighting */
        .syntax-keyword { color: #569cd6; }
        .syntax-string { color: #ce9178; }
        .syntax-comment { color: #6a9955; }
        .syntax-number { color: #b5cea8; }
        .syntax-function { color: #dcdcaa; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .terminal {
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="ide-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>📁 Explorer</h3>
            </div>
            <div class="file-explorer">
                <ul class="file-tree" id="fileTree">
                    <li class="file-item" data-file="main.cpp">

                    <li class="file-item" data-file="app.js">

                    <li class="file-item" data-file="style.css">
                        <span class="file-icon">📄</span>

                    <li class="file-item" data-file="README.md">
                        <span class="file-icon">📄</span>

                    </li>

        <!-- Main Editor Area -->
        <div class="editor-area">
            <!-- Toolbar -->
            <div class="toolbar">
                <button class="toolbar-btn" onclick="newFile()">📄 New</button>
                <button class="toolbar-btn" onclick="openFile()">📂 Open</button>
                <button class="toolbar-btn" onclick="saveFile()">💾 Save</button>
                <button class="toolbar-btn" onclick="saveAs()">💾 Save As</button>

            <!-- Code Editor -->
            <div class="code-editor">
                <div class="editor-container">
                    <div class="line-numbers" id="lineNumbers">1</div>
                    <textarea class="editor-textarea" id="codeEditor" placeholder="// Welcome to RawrZ Custom IDE

                </div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-left">
                    <span>RawrZ Custom IDE v1.0.0</span>
                    <span id="cursorPosition">Ln 1, Col 1</span>
                    <span id="fileType">C++</span>
                </div>
                <div class="status-right">
                    <span id="encoding">UTF-8</span>
                    <span id="lineEnding">LF</span>
                    <span id="indentSize">4 spaces</span>
                </div>
            </div>

            <!-- Terminal -->
            <div class="terminal" id="terminal" style="display: none;">
                <div class="terminal-header">
                    RawrZ Terminal
                </div>
                <div class="terminal-content" id="terminalOutput">
                    RawrZ Custom IDE Terminal v1.0.0<br>
                    Type 'help' for available commands<br>
                    <br>
                </div>
                <div style="padding: 5px 10px; border-top: 1px solid #3e3e42;">
                    <span style="color: #00ff00;">$ </span>
                    <input type="text" class="terminal-input" id="terminalInput" placeholder="Enter command...">
                </div>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" onclick="cutText()">✂️ Cut</div>
        <div class="context-menu-item" onclick="copyText()">📋 Copy</div>
        <div class="context-menu-item" onclick="pasteText()">📄 Paste</div>
        <div class="context-menu-item" onclick="selectAll()">📝 Select All</div>
    </div>

    <script>
        // RawrZ Custom IDE Core - Built from scratch to avoid licensing issues
        class RawrZIDE {
            constructor() {
                this.currentFile = 'main.cpp';
                this.openFiles = new Set(['main.cpp']);
                this.unsavedChanges = new Set();
                this.compilers = new Map();
                this.projects = new Map();
                this.settings = {
                    theme: 'monokai',
                    fontSize: 14,
                    tabSize: 4,
                    autoSave: true,
                    compilerPaths: {}
                };
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.updateLineNumbers();
                this.updateCursorPosition();
                this.setupTerminal();
                this.detectCompilers();
                this.loadSettings();
            }

            setupEventListeners() {
                const editor = document.getElementById('codeEditor');
                const fileTree = document.getElementById('fileTree');
                const contextMenu = document.getElementById('contextMenu');

                // Editor events
                editor.addEventListener('input', () => {
                    this.updateLineNumbers();
                    this.updateCursorPosition();
                    this.markUnsaved();
                });

                editor.addEventListener('keydown', (e) => {
                    this.handleKeyDown(e);
                });

                editor.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    this.showContextMenu(e);
                });

                // File tree events
                fileTree.addEventListener('click', (e) => {
                    if (e.target.closest('.file-item')) {
                        const file = e.target.closest('.file-item').dataset.file;
                        this.openFile(file);
                    }
                });

                // Hide context menu on click
                document.addEventListener('click', () => {
                    contextMenu.style.display = 'none';
                });
            }

            handleKeyDown(e) {
                // Custom keyboard shortcuts
                if (e.ctrlKey) {
                    switch(e.key) {
                        case 's':
                            e.preventDefault();
                            this.saveFile();
                            break;
                        case 'n':
                            e.preventDefault();
                            this.newFile();
                            break;
                        case 'o':
                            e.preventDefault();
                            this.openFile();
                            break;
                        case 'r':
                            e.preventDefault();
                            this.runCode();
                            break;
                        case 'b':
                            e.preventDefault();
                            this.buildProject();
                            break;
                    }
                }

                // Tab handling
                if (e.key === 'Tab') {
                    e.preventDefault();
                    this.insertTab();
                }
            }

            insertTab() {
                const editor = document.getElementById('codeEditor');
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const value = editor.value;
                
                editor.value = value.substring(0, start) + '    ' + value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 4;
            }

            updateLineNumbers() {
                const editor = document.getElementById('codeEditor');
                const lines = editor.value.split('\n').length;
                const lineNumbers = document.getElementById('lineNumbers');
                
                let numbers = '';
                for (let i = 1; i <= lines; i++) {
                    numbers += i + '\n';
                }
                lineNumbers.textContent = numbers;
            }

            updateCursorPosition() {
                const editor = document.getElementById('codeEditor');
                const text = editor.value.substring(0, editor.selectionStart);
                const lines = text.split('\n');
                const line = lines.length;
                const col = lines[lines.length - 1].length + 1;
                
                document.getElementById('cursorPosition').textContent = `Ln ${line}, Col ${col}`;
            }

            markUnsaved() {
                this.unsavedChanges.add(this.currentFile);
                this.updateTabDisplay();
            }

            updateTabDisplay() {
                const tab = document.querySelector(`[data-file="${this.currentFile}"]`);
                if (tab && this.unsavedChanges.has(this.currentFile)) {
                    tab.textContent = tab.textContent.replace('●', '') + '●';
                }
            }

            openFile(filename) {
                this.currentFile = filename;
                this.openFiles.add(filename);
                
                // Update active file in tree
                document.querySelectorAll('.file-item').forEach(item => {
                    item.classList.remove('active');
                });
                document.querySelector(`[data-file="${filename}"]`).classList.add('active');
                
                // Update tab
                this.updateTabs();
                
                // Load file content (simulated)
                this.loadFileContent(filename);
            }

            loadFileContent(filename) {
                const editor = document.getElementById('codeEditor');
                const fileContents = {
                    'main.cpp': `// RawrZ Custom IDE - C++ File
#include <iostream>

int main() {
    std::cout << "Hello from RawrZ IDE!" << std::endl;
    return 0;
}`,
                    'app.js': `// RawrZ Custom IDE - JavaScript File
console.log('Welcome to RawrZ Custom IDE!');

class RawrZApp {
    constructor() {
        this.name = 'RawrZ Custom IDE';
    }
    
    run() {
        console.log(\`Running \${this.name}\`);
    }
}

const app = new RawrZApp();
app.run();`,
                    'style.css': `/* RawrZ Custom IDE - CSS File */
.rawrz-ide {
    font-family: 'Consolas', monospace;
    background: #1e1e1e;
    color: #d4d4d4;
}

.rawrz-editor {
    background: #1e1e1e;
    border: 1px solid #3e3e42;
    border-radius: 4px;
}`,
                    'README.md': `# RawrZ Custom IDE

Your own development platform built from scratch.

## Features
- Custom code editor
- Built-in compiler
- Debugging tools
- Terminal integration
- Plugin system

## Getting Started
1. Open a file
2. Write your code
3. Build and run

Built with ❤️ by RawrZ Team`
                };
                
                editor.value = fileContents[filename] || `// ${filename}\n// Your custom file content here...`;
                this.updateLineNumbers();
            }

            updateTabs() {
                const tabBar = document.getElementById('tabBar');
                tabBar.innerHTML = '';
                
                this.openFiles.forEach(file => {
                    const tab = document.createElement('div');
                    tab.className = `tab ${file === this.currentFile ? 'active' : ''}`;
                    tab.dataset.file = file;
                    tab.innerHTML = `${file} <span class="tab-close" onclick="ide.closeTab('${file}')">×</span>`;
                    tabBar.appendChild(tab);
                });
            }

            closeTab(filename) {
                if (this.openFiles.size <= 1) return;
                
                this.openFiles.delete(filename);
                this.unsavedChanges.delete(filename);
                
                if (this.currentFile === filename) {
                    this.currentFile = Array.from(this.openFiles)[0];
                    this.openFile(this.currentFile);
                }
                
                this.updateTabs();
            }

            showContextMenu(e) {
                const contextMenu = document.getElementById('contextMenu');
                contextMenu.style.display = 'block';
                contextMenu.style.left = e.pageX + 'px';
                contextMenu.style.top = e.pageY + 'px';
            }

            setupTerminal() {
                const terminalInput = document.getElementById('terminalInput');
                terminalInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        this.executeTerminalCommand(e.target.value);
                        e.target.value = '';
                    }
                });
            }

            executeTerminalCommand(command) {
                const output = document.getElementById('terminalOutput');
                output.innerHTML += `<span style="color: #00ff00;">$ ${command}</span><br>`;
                
                // Enhanced command processing
                const cmd = command.toLowerCase().trim();
                switch(cmd) {
                    case 'help':
                        output.innerHTML += `RawrZ IDE Commands:<br>
- help: Show this help<br>
- clear: Clear terminal<br>
- build: Build current project<br>
- run: Run current project<br>
- compile: Compile current file<br>
- ls: List files<br>
- pwd: Show current directory<br>
- detect-compilers: Detect installed compilers<br>
- config-compiler: Configure compiler paths<br>
- download-compiler: Get compiler download links<br>
- new-project: Create new project<br>
- open-project: Open existing project<br>`;
                        break;
                    case 'clear':
                        output.innerHTML = '';
                        break;
                    case 'build':
                        this.buildProject();
                        break;
                    case 'run':
                        this.runProject();
                        break;
                    case 'compile':
                        this.compileCurrentFile();
                        break;
                    case 'detect-compilers':
                        this.detectCompilers();
                        break;
                    case 'config-compiler':
                        this.showCompilerConfig();
                        break;
                    case 'download-compiler':
                        this.showCompilerDownloads();
                        break;
                    case 'new-project':
                        this.createNewProject();
                        break;
                    case 'open-project':
                        this.openProject();
                        break;
                    case 'ls':
                        output.innerHTML += 'main.cpp app.js style.css README.md<br>';
                        break;
                    case 'pwd':
                        output.innerHTML += '/home/rawrz/projects<br>';
                        break;
                    default:
                        output.innerHTML += `Command not found: ${command}<br>`;
                }
                
                output.scrollTop = output.scrollHeight;
            }

            async detectCompilers() {
                const output = document.getElementById('terminalOutput');
                output.innerHTML += 'Detecting installed compilers...<br>';
                
                // Check for common compilers
                const compilers = [
                    { name: 'GCC', command: 'gcc', version: '--version' },
                    { name: 'G++', command: 'g++', version: '--version' },
                    { name: 'Clang', command: 'clang', version: '--version' },
                    { name: 'Clang++', command: 'clang++', version: '--version' },
                    { name: 'Node.js', command: 'node', version: '--version' },
                    { name: 'Python', command: 'python', version: '--version' },
                    { name: 'Java', command: 'javac', version: '-version' },
                    { name: 'C#', command: 'csc', version: '' }
                ];
                
                for (const compiler of compilers) {
                    try {
                        // Simulate compiler detection
                        const isInstalled = Math.random() > 0.5; // Random for demo
                        if (isInstalled) {
                            this.compilers.set(compiler.name, {
                                command: compiler.command,
                                version: 'v1.0.0',
                                path: `/usr/bin/${compiler.command}`,
                                installed: true
                            });
                            output.innerHTML += `✓ ${compiler.name} found at /usr/bin/${compiler.command}<br>`;
                        } else {
                            output.innerHTML += `✗ ${compiler.name} not found<br>`;
                        }
                    } catch (error) {
                        output.innerHTML += `✗ ${compiler.name} detection failed<br>`;
                    }
                }
                
                output.innerHTML += `Found ${this.compilers.size} compilers<br>`;
                output.scrollTop = output.scrollHeight;
            }

            showCompilerDownloads() {
                const output = document.getElementById('terminalOutput');
                output.innerHTML += `Compiler Download Links:<br><br>
<b>C/C++ Compilers:</b><br>
• GCC/G++: https://gcc.gnu.org/install/<br>
• Clang/Clang++: https://clang.llvm.org/get_started.html<br>
• MinGW: https://www.mingw-w64.org/downloads/<br><br>
<b>Other Languages:</b><br>
• Node.js: https://nodejs.org/<br>
• Python: https://www.python.org/downloads/<br>
• Java JDK: https://adoptium.net/<br>
• .NET SDK: https://dotnet.microsoft.com/download<br><br>
<b>IDE Extensions:</b><br>
• VS Code: https://code.visualstudio.com/<br>
• IntelliJ: https://www.jetbrains.com/<br><br>
After installation, run 'detect-compilers' to configure.<br>`;
                output.scrollTop = output.scrollHeight;
            }

            showCompilerConfig() {
                const output = document.getElementById('terminalOutput');
                output.innerHTML += `Compiler Configuration:<br><br>
To configure compiler paths:<br>
1. Go to Settings (⚙️ button)<br>
2. Select "Compiler Paths"<br>
3. Set paths for each compiler<br>
4. Save configuration<br><br>
Example paths:<br>
• GCC: C:\\mingw64\\bin\\gcc.exe<br>
• G++: C:\\mingw64\\bin\\g++.exe<br>
• Node.js: C:\\Program Files\\nodejs\\node.exe<br>
• Python: C:\\Python39\\python.exe<br>`;
                output.scrollTop = output.scrollHeight;
            }

            async buildProject() {
                const output = document.getElementById('terminalOutput');
                output.innerHTML += 'Building project...<br>';
                
                try {
                    const response = await fetch('/api/ide/compile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sourceCode: document.getElementById('codeEditor').value,
                            language: this.getCurrentLanguage(),
                            options: { optimize: true }
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        output.innerHTML += '✓ Build successful!<br>';
                        output.innerHTML += `Output: ${result.data.output}<br>`;
                    } else {
                        output.innerHTML += '✗ Build failed!<br>';
                        output.innerHTML += `Errors: ${result.data.errors.join('<br>')}<br>`;
                    }
                } catch (error) {
                    output.innerHTML += `✗ Build error: ${error.message}<br>`;
                }
                
                output.scrollTop = output.scrollHeight;
            }

            async runProject() {
                const output = document.getElementById('terminalOutput');
                output.innerHTML += 'Running project...<br>';
                
                try {
                    const response = await fetch('/api/ide/run', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sourceCode: document.getElementById('codeEditor').value,
                            language: this.getCurrentLanguage()
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        output.innerHTML += '✓ Execution successful!<br>';
                        output.innerHTML += `Output: ${result.data.execution.output}<br>`;
                    } else {
                        output.innerHTML += '✗ Execution failed!<br>';
                        output.innerHTML += `Errors: ${result.data.execution.errors.join('<br>')}<br>`;
                    }
                } catch (error) {
                    output.innerHTML += `✗ Execution error: ${error.message}<br>`;
                }
                
                output.scrollTop = output.scrollHeight;
            }

            getCurrentLanguage() {
                const filename = this.currentFile.toLowerCase();
                if (filename.endsWith('.cpp') || filename.endsWith('.cc') || filename.endsWith('.cxx')) return 'cpp';
                if (filename.endsWith('.c')) return 'c';
                if (filename.endsWith('.js')) return 'js';
                if (filename.endsWith('.py')) return 'py';
                if (filename.endsWith('.java')) return 'java';
                if (filename.endsWith('.cs')) return 'cs';
                return 'cpp'; // default
            }

            loadSettings() {
                const saved = localStorage.getItem('rawrz-ide-settings');
                if (saved) {
                    this.settings = { ...this.settings, ...JSON.parse(saved) };
                }
            }

            saveSettings() {
                localStorage.setItem('rawrz-ide-settings', JSON.stringify(this.settings));
            }
        }

        // Global functions
        function newFile() {
            const filename = prompt('Enter filename:');
            if (filename) {
                ide.openFiles.add(filename);
                ide.currentFile = filename;
                ide.loadFileContent(filename);
                ide.updateTabs();
            }
        }

        function openFile() {
            // Simulate file open dialog
            const files = ['main.cpp', 'app.js', 'style.css', 'README.md'];
            const filename = files[Math.floor(Math.random() * files.length)];
            ide.openFile(filename);
        }

        function saveFile() {
            ide.unsavedChanges.delete(ide.currentFile);
            ide.updateTabDisplay();
            console.log(`Saved ${ide.currentFile}`);
        }

        function saveAs() {
            const filename = prompt('Save as:');
            if (filename) {
                ide.currentFile = filename;
                saveFile();
            }
        }

        function runCode() {
            const output = document.getElementById('terminalOutput');
            output.innerHTML += 'Running code...<br>';
            output.innerHTML += 'Hello from RawrZ Custom IDE!<br>';
            output.scrollTop = output.scrollHeight;
        }

        function buildProject() {
            const output = document.getElementById('terminalOutput');
            output.innerHTML += 'Building project with RawrZ compiler...<br>';
            output.innerHTML += 'Compilation successful!<br>';
            output.scrollTop = output.scrollHeight;
        }

        function debugCode() {
            console.log('Starting debugger...');
            alert('Debugger started! Set breakpoints and step through your code.');
        }

        function toggleTerminal() {
            const terminal = document.getElementById('terminal');
            terminal.style.display = terminal.style.display === 'none' ? 'block' : 'none';
        }

        function openSettings() {
            showSettingsPanel();
        }

        function showSettingsPanel() {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.8); z-index: 10000; display: flex;
                align-items: center; justify-content: center;
            `;
            
            modal.innerHTML = `
                <div style="background: #2d2d30; border-radius: 8px; padding: 20px; width: 600px; max-height: 80vh; overflow-y: auto;">
                    <h2 style="color: #ffffff; margin-bottom: 20px;">⚙️ RawrZ IDE Settings</h2>
                    
                    <div style="margin-bottom: 20px;">
                        <h3 style="color: #ffd700; margin-bottom: 10px;">Editor Settings</h3>
                        <div style="margin-bottom: 10px;">
                            <label style="color: #d4d4d4; display: block; margin-bottom: 5px;">Theme:</label>
                            <select id="themeSelect" style="background: #1e1e1e; color: #d4d4d4; border: 1px solid #3e3e42; padding: 5px; width: 200px;">
                                <option value="monokai">Monokai</option>
                                <option value="dracula">Dracula</option>
                                <option value="material">Material</option>
                            </select>
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="color: #d4d4d4; display: block; margin-bottom: 5px;">Font Size:</label>
                            <input type="number" id="fontSizeInput" value="14" min="8" max="24" 
                                   style="background: #1e1e1e; color: #d4d4d4; border: 1px solid #3e3e42; padding: 5px; width: 100px;">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="color: #d4d4d4; display: block; margin-bottom: 5px;">Tab Size:</label>
                            <input type="number" id="tabSizeInput" value="4" min="2" max="8" 
                                   style="background: #1e1e1e; color: #d4d4d4; border: 1px solid #3e3e42; padding: 5px; width: 100px;">
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <h3 style="color: #ffd700; margin-bottom: 10px;">Compiler Paths</h3>
                        <div style="margin-bottom: 10px;">
                            <label style="color: #d4d4d4; display: block; margin-bottom: 5px;">GCC Path:</label>
                            <input type="text" id="gccPath" placeholder="C:\\mingw64\\bin\\gcc.exe" 
                                   style="background: #1e1e1e; color: #d4d4d4; border: 1px solid #3e3e42; padding: 5px; width: 100%;">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="color: #d4d4d4; display: block; margin-bottom: 5px;">G++ Path:</label>
                            <input type="text" id="gppPath" placeholder="C:\\mingw64\\bin\\g++.exe" 
                                   style="background: #1e1e1e; color: #d4d4d4; border: 1px solid #3e3e42; padding: 5px; width: 100%;">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="color: #d4d4d4; display: block; margin-bottom: 5px;">Node.js Path:</label>
                            <input type="text" id="nodePath" placeholder="C:\\Program Files\\nodejs\\node.exe" 
                                   style="background: #1e1e1e; color: #d4d4d4; border: 1px solid #3e3e42; padding: 5px; width: 100%;">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="color: #d4d4d4; display: block; margin-bottom: 5px;">Python Path:</label>
                            <input type="text" id="pythonPath" placeholder="C:\\Python39\\python.exe" 
                                   style="background: #1e1e1e; color: #d4d4d4; border: 1px solid #3e3e42; padding: 5px; width: 100%;">
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <h3 style="color: #ffd700; margin-bottom: 10px;">Project Settings</h3>
                        <div style="margin-bottom: 10px;">
                            <label style="color: #d4d4d4; display: block; margin-bottom: 5px;">Default Project Directory:</label>
                            <input type="text" id="projectDir" placeholder="C:\\Users\\YourName\\Projects" 
                                   style="background: #1e1e1e; color: #d4d4d4; border: 1px solid #3e3e42; padding: 5px; width: 100%;">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="color: #d4d4d4;">
                                <input type="checkbox" id="autoSave" checked> Auto-save files
                            </label>
                        </div>
                    </div>
                    
                    <div style="text-align: right;">
                        <button onclick="saveSettings()" style="background: #0e639c; color: white; border: none; padding: 8px 16px; border-radius: 4px; margin-right: 10px; cursor: pointer;">Save</button>
                        <button onclick="closeSettings()" style="background: #3e3e42; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Cancel</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Load current settings
            document.getElementById('themeSelect').value = ide.settings.theme;
            document.getElementById('fontSizeInput').value = ide.settings.fontSize;
            document.getElementById('tabSizeInput').value = ide.settings.tabSize;
            document.getElementById('gccPath').value = ide.settings.compilerPaths.gcc || '';
            document.getElementById('gppPath').value = ide.settings.compilerPaths.gpp || '';
            document.getElementById('nodePath').value = ide.settings.compilerPaths.node || '';
            document.getElementById('pythonPath').value = ide.settings.compilerPaths.python || '';
            document.getElementById('projectDir').value = ide.settings.projectDir || '';
            document.getElementById('autoSave').checked = ide.settings.autoSave;
        }

        function saveSettings() {
            ide.settings.theme = document.getElementById('themeSelect').value;
            ide.settings.fontSize = parseInt(document.getElementById('fontSizeInput').value);
            ide.settings.tabSize = parseInt(document.getElementById('tabSizeInput').value);
            ide.settings.compilerPaths.gcc = document.getElementById('gccPath').value;
            ide.settings.compilerPaths.gpp = document.getElementById('gppPath').value;
            ide.settings.compilerPaths.node = document.getElementById('nodePath').value;
            ide.settings.compilerPaths.python = document.getElementById('pythonPath').value;
            ide.settings.projectDir = document.getElementById('projectDir').value;
            ide.settings.autoSave = document.getElementById('autoSave').checked;
            
            ide.saveSettings();
            closeSettings();
            
            // Apply settings
            const editor = document.getElementById('codeEditor');
            editor.style.fontSize = ide.settings.fontSize + 'px';
            
            console.log('Settings saved successfully!');
        }

        function closeSettings() {
            const modal = document.querySelector('div[style*="position: fixed"]');
            if (modal) modal.remove();
        }

        // Context menu functions
        function cutText() {
            document.execCommand('cut');
        }

        function copyText() {
            document.execCommand('copy');
        }

        function pasteText() {
            document.execCommand('paste');
        }

        function selectAll() {
            document.execCommand('selectAll');
        }

        // Initialize IDE
        const ide = new RawrZIDE();
    </script>
</body>
</html>
