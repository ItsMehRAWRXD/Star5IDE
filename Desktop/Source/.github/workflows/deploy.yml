name: Deploy to DigitalOcean

on:
  push:
    branches: [ main, security/cleanup ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test --if-present
      
    - name: Build application
      run: |
        npm run build --if-present
        echo "Application built successfully"
        
    - name: Deploy to DigitalOcean
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.DROPLET_IP }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /root/rawrz-security-platform
          git pull origin main
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml up -d --build
          docker system prune -f
          
    - name: Health Check
      run: |
        sleep 30
        curl -f https://screenpilot.dev/health || exit 1
        
    - name: Notify deployment
      if: success()
      run: |
        echo "✅ Deployment to screenpilot.dev completed successfully!"
        echo "🌐 Application is live at: https://screenpilot.dev"