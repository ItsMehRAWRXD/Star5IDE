events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    
    # Upstream for RawrZ panel
    upstream rawrz_panel {
        server rawrz-panel:3000;
        keepalive 32;
    }
    
    # Main server block for lionfish-app
    server {
        listen 80;
        server_name lionfish-app-ey7kn.ondigitalocean.app;
        
        # Security headers
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        
        # Panel routes - RawrZ Security Platform
        location /panel {
            # Remove /panel prefix and proxy to RawrZ
            rewrite ^/panel(.*)$ $1 break;
            
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://rawrz_panel;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            
            # Add panel-specific headers
            proxy_set_header X-Panel-Path /panel;
            proxy_set_header X-Base-URL https://lionfish-app-ey7kn.ondigitalocean.app;
        }
        
        # Panel API routes
        location /panel/api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://rawrz_panel/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Panel-Path /panel;
        }
        
        # Panel static files
        location /panel/static/ {
            proxy_pass http://rawrz_panel/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Panel health check
        location /panel/health {
            access_log off;
            proxy_pass http://rawrz_panel/health;
        }
        
        # Default location for main app (if needed)
        location / {
            # This can be used for your main lionfish app
            # or redirect to panel
            return 301 /panel;
        }
    }
}
