# docker-compose.yml
version: '3.8'

services:
  mongo:
    image: mongo:6
    environment:
      MONGO_INITDB_DATABASE: saas-app
    volumes:
      - mongo_data:/data/db
    networks:
      - crypting-network

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/saas-app
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_USERNAME: ${SENDGRID_USERNAME}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      - mongo
    networks:
      - crypting-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - crypting-network

volumes:
  mongo_data:

networks:
  crypting-network:
    driver: bridge