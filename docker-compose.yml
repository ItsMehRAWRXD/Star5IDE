version: '3.8'

services:
  rawrz-security:
    build: .
    container_name: rawrz-security-platform
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    volumes:
      # Persistent storage for uploads, data, and logs
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./logs:/app/logs
      # Mount host files for analysis (optional)
      - /var/log:/host/logs:ro
    ports:
      - "3000:3000"
    networks:
      - rawrz-network
    # Security settings
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN  # For network tools
      - SYS_PTRACE # For process analysis
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # Optional: Add a web interface container (nginx)
  nginx:
    image: nginx:alpine
    container_name: rawrz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - rawrz-security
    networks:
      - rawrz-network

networks:
  rawrz-network:
    driver: bridge